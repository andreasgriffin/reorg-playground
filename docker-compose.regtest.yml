# Standalone local regtest environment with bundled explorer services.
x-bitcoin-image: &bitcoin_image bitcoin/bitcoin:30.2
x-bitcoin-version: &bitcoin_version "30.2"

services:
  bitcoind-regtest-a:
    image: *bitcoin_image
    restart: unless-stopped
    ports:
      - "18444:18444"
      - "18443:18443"
    command:
      - -regtest
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=reorg-playground
      - -rpcpassword=reorg-playground
      - -rpcport=18443
      - -port=18444
      - -txindex=1
      - -blockfilterindex=1
      - -peerblockfilters=1
      - -addnode=bitcoind-regtest-b:18444
      - -datadir=/home/bitcoin/.bitcoin
    volumes:
      - bitcoind_regtest_a_data:/home/bitcoin/.bitcoin
    healthcheck:
      test:
        - CMD
        - bitcoin-cli
        - -regtest
        - -rpcconnect=127.0.0.1
        - -rpcport=18443
        - -rpcuser=reorg-playground
        - -rpcpassword=reorg-playground
        - getblockchaininfo
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  bitcoind-regtest-b:
    image: *bitcoin_image
    restart: unless-stopped
    ports:
      - "18454:18444"
      - "18453:18443"
    command:
      - -regtest
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=reorg-playground
      - -rpcpassword=reorg-playground
      - -rpcport=18443
      - -port=18444
      - -txindex=1
      - -blockfilterindex=1
      - -peerblockfilters=1
      - -datadir=/home/bitcoin/.bitcoin
    volumes:
      - bitcoind_regtest_b_data:/home/bitcoin/.bitcoin
    healthcheck:
      test:
        - CMD
        - bitcoin-cli
        - -regtest
        - -rpcconnect=127.0.0.1
        - -rpcport=18443
        - -rpcuser=reorg-playground
        - -rpcpassword=reorg-playground
        - getblockchaininfo
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  fulcrum-regtest:
    image: cculianu/fulcrum:latest
    restart: unless-stopped
    depends_on:
      bitcoind-regtest-a:
        condition: service_healthy
    command:
      - Fulcrum
      - /etc/fulcrum/fulcrum-regtest.conf
    ports:
      - "50001:50001"
      - "8082:8080"
    volumes:
      - fulcrum_regtest_data:/data
      - ./docker/fulcrum-regtest.conf:/etc/fulcrum/fulcrum-regtest.conf:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import sys, urllib.request
          urllib.request.urlopen("http://127.0.0.1:8080/stats", timeout=3)
          sys.exit(0)
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  mempool-db-regtest:
    image: mariadb:10.5.21
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mempool
      MYSQL_USER: mempool
      MYSQL_PASSWORD: mempool
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - mempool_regtest_db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -umempool
        - -pmempool
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mempool-api-regtest:
    image: mempool/backend:latest
    restart: unless-stopped
    depends_on:
      bitcoind-regtest-a:
        condition: service_healthy
      fulcrum-regtest:
        condition: service_healthy
      mempool-db-regtest:
        condition: service_healthy
    environment:
      MEMPOOL_NETWORK: regtest
      MEMPOOL_BACKEND: electrum
      CORE_RPC_HOST: bitcoind-regtest-a
      CORE_RPC_PORT: "18443"
      CORE_RPC_USERNAME: reorg-playground
      CORE_RPC_PASSWORD: reorg-playground
      ELECTRUM_HOST: fulcrum-regtest
      ELECTRUM_PORT: "50001"
      ELECTRUM_TLS_ENABLED: "false"
      DATABASE_ENABLED: "true"
      DATABASE_HOST: mempool-db-regtest
      DATABASE_DATABASE: mempool
      DATABASE_USERNAME: mempool
      DATABASE_PASSWORD: mempool
      STATISTICS_ENABLED: "true"
    command:
      - ./wait-for-it.sh
      - mempool-db-regtest:3306
      - --timeout=720
      - --strict
      - --
      - ./start.sh
    volumes:
      - mempool_regtest_api_cache:/backend/cache
    ports:
      - "8999:8999"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8999/api/v1/backend-info >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  mempool-web-regtest:
    image: mempool/frontend:latest
    restart: unless-stopped
    depends_on:
      mempool-api-regtest:
        condition: service_healthy
    environment:
      FRONTEND_HTTP_PORT: "8080"
      BACKEND_MAINNET_HTTP_HOST: mempool-api-regtest
      BACKEND_MAINNET_HTTP_PORT: "8999"
      NGINX_PROTOCOL: http
      NGINX_HOSTNAME: localhost
      NGINX_PORT: "8081"
      MAINNET_ENABLED: "false"
      TESTNET_ENABLED: "false"
      TESTNET4_ENABLED: "false"
      SIGNET_ENABLED: "false"
      REGTEST_ENABLED: "true"
      LIQUID_ENABLED: "false"
      LIQUID_TESTNET_ENABLED: "false"
      ROOT_NETWORK: regtest
      MEMPOOL_WEBSITE_URL: http://localhost:8081
      HISTORICAL_PRICE: "false"
      ADDITIONAL_CURRENCIES: "false"
      ACCELERATOR: "false"
      ACCELERATOR_BUTTON: "false"
      MINING_DASHBOARD: "false"
      LIGHTNING: "false"
    command:
      - ./wait-for
      - mempool-api-regtest:8999
      - --timeout=720
      - --
      - nginx
      - -g
      - daemon off;
    ports:
      - "8081:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8080/ >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        BITCOIN_VERSION: *bitcoin_version
    restart: unless-stopped
    depends_on:
      bitcoind-regtest-a:
        condition: service_healthy
      bitcoind-regtest-b:
        condition: service_healthy
    environment:
      CONFIG_FILE: /app/config/regtest-env.toml
      RUST_LOG: info
    expose:
      - "2323"
    volumes:
      - app_db:/data
      - ./config.regtest-env.toml:/app/config/regtest-env.toml:ro

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  app_db:
  bitcoind_regtest_a_data:
  bitcoind_regtest_b_data:
  fulcrum_regtest_data:
  mempool_regtest_api_cache:
  mempool_regtest_db_data:
