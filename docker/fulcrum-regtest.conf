# Fulcrum configuration for the bundled regtest explorer stack.
# Fulcrum discovers the active chain from the connected bitcoind instance, so no
# separate network flag is needed here.

bitcoind = bitcoind-regtest-a:18443
rpcuser = reorg-playground
rpcpassword = reorg-playground

tcp = 0.0.0.0:50001
stats = 0.0.0.0:8080
polltime = 1.0

peering = false
announce = false
