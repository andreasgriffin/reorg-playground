# reorg-playground regtest-only Docker configuration

database_path = "/data/reorg.db"
address = "0.0.0.0:2323"
rss_base_url = ""

[[networks]]
id = 0
name = "Regtest"
description = "Bitcoin Regtest (dockerized pair)"
query_interval = 1
first_tracked_height = 0
visible_heights_from_tip = 100
extra_hotspot_heights = 20
network_type = "Regtest"
view_only_mode = false
mempool_url = "http://localhost:8081"
fulcrum_port = 50001
fulcrum_stats_port = 8082
mempool_web_port = 8081
mempool_api_port = 8999
stale_rate_windows = [100, 1000]
stale_rate_include_all_time = true

    [[networks.nodes]]
